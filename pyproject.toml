[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name            = "carolyne"
version         = "0.1.0"
description     = "ISA-agnostic out-of-order CPU generator built on the Kathryn hardware-construction library"
requires-python = ">=3.9"
# `kathryn` is not on PyPI — install it from the sibling repo first:
#   pip install -e ../Kathryn2        (or: cd ../Kathryn2 && maturin develop)
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
# simulate the emitted Verilog: cocotb drives it, the PyPI wheel supplies a
# Verilator new enough for cocotb 2 (5.048 reports itself as "5.48.0")
sim = ["cocotb>=2.0,<3", "verilator>=5.36"]

[tool.setuptools.packages.find]
include = ["carolyne*"]

[tool.pytest.ini_options]
markers = [
  "slow: runs a simulator end to end (compile, build, simulate); minutes on a cold build cache",
]
